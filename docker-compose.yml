# Resilience-Alpha — démonstrateur de résilience (SI de paiement fictif + chaîne d'observation et de reprise)
# Seul le WAF est publié sur le réseau du groupe. Les interfaces de gestion (Grafana, Prometheus, Loki, Alertmanager, assistant RAG,
# dashboard de supervision)
# ne sont publiées que sur 127.0.0.1 (MGMT_BIND) et demandent un identifiant (admin / secrets/<service>_password) :
# base, API, secrets et outils internes ne sont jamais exposés.
name: resilience-alpha

# Le pilote json-file recopie les labels Compose dans chaque ligne de journal :
# Alloy identifie ainsi le service émetteur en lisant les fichiers, sans accès au socket Docker.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    labels: "com.docker.compose.project,com.docker.compose.service"

# Limites mémoire (mem_limit de chaque service) : 2 à 10 fois le pic mesuré sous la charge de la démonstration
# (docs/securite/revue-durcissement.md), un conteneur emballé ne peut plus affamer la VM (16 Go). Pas de limite CPU :
# un étranglement ralentirait la reprise, et le LLM est déjà borné par LLM_NUM_THREAD.
x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  logging: *logging

x-python-service: &python-service
  <<: *hardening
  read_only: true
  tmpfs: ["/tmp"]
  depends_on:
    postgres:
      condition: service_healthy
  networks: [app, data]

services:
  # ───────────────────────────── SI métier (pilier DEV) ─────────────────────────────
  postgres:
    image: postgres:17-alpine
    mem_limit: 1g
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password, auth_db_password, pay_db_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [data]
    # Lancé directement sous l'utilisateur postgres de l'image (uid 70) et sans aucune capability : l'entrypoint ne
    # passe plus par root ni par gosu (chown + changement d'utilisateur). Le volume pgdata appartient déjà à l'uid 70,
    # y compris neuf (copie des droits de l'image) ; essayé sur un volume vide : initdb et db/init passent.
    # Sauvegarde, restauration et pont de remédiation utilisent déjà `exec -u postgres`.
    user: "70:70"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  auth-service:
    <<: *python-service
    build:
      context: ./services
      dockerfile: auth-service/Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-resilience-alpha}/auth-service:latest
    # argon2id (64 Mio par hachage) dans le pool de 40 threads : 2,5 Gio mesurés pour 60 connexions simultanées
    mem_limit: 3g
    environment:
      SERVICE_NAME: auth-service
      ROOT_PATH: /api/auth
      DB_NAME: authdb
      DB_USER: auth_svc
      DB_PASSWORD_FILE: /run/secrets/auth_db_password
      JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private.pem
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-900}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@resilience.local}
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      # Secret TOTP du compte admin, à qui la double authentification est imposée (scripts/init_secrets.py)
      ADMIN_TOTP_SECRET_FILE: /run/secrets/admin_totp_secret
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    secrets: [auth_db_password, jwt_private.pem, admin_password, admin_totp_secret]

  payment-api:
    <<: *python-service
    build:
      context: ./services
      dockerfile: payment-api/Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-resilience-alpha}/payment-api:latest
    mem_limit: 512m
    environment:
      SERVICE_NAME: payment-api
      ROOT_PATH: /api/payments
      DB_NAME: paydb
      DB_USER: pay_svc
      DB_PASSWORD_FILE: /run/secrets/pay_db_password
      JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public.pem
      INTEGRITY_INTERVAL_SECONDS: ${INTEGRITY_INTERVAL_SECONDS:-15}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    secrets: [pay_db_password, jwt_public.pem]

  frontend:
    <<: *hardening
    build: ./services/frontend
    image: ${COMPOSE_PROJECT_NAME:-resilience-alpha}/frontend:latest
    mem_limit: 256m
    read_only: true
    tmpfs: ["/tmp"]
    networks: [dmz, app]

  # ───────────────────────────── Défense (pilier SÉCURITÉ) ─────────────────────────────
  # WAF ModSecurity + OWASP CRS : unique point d'entrée publié, relaie vers le frontal nginx.
  waf:
    <<: *hardening
    image: owasp/modsecurity-crs:4.25-nginx-alpine-lts
    mem_limit: 512m
    depends_on: [frontend]
    ports:
      - "${FRONT_BIND:-0.0.0.0}:${FRONT_PORT:-8080}:8080"
    environment:
      BACKEND: http://frontend:8080
      PORT: "8080"
      SERVER_HEADER: ""
      # L'image ajoute par défaut des en-têtes CORS ouverts (Access-Control-Allow-Origin: * sur ses pages 403,
      # Access-Control-Allow-Headers: * partout). Le front et les API sont servis sur la même origine : aucun CORS
      # n'est nécessaire, une valeur vide retire l'en-tête (more_set_headers).
      CORS_HEADER_403_ALLOW_ORIGIN: ""
      CORS_HEADER_403_MAX_AGE: ""
      CORS_HEADER_403_ALLOW_METHODS: ""
      CORS_HEADER_ACCESS_CONTROL_ALLOW_HEADERS: ""
      PARANOIA: ${WAF_PARANOIA:-1}
      BLOCKING_PARANOIA: ${WAF_PARANOIA:-1}
      ANOMALY_INBOUND: ${WAF_ANOMALY_INBOUND:-5}
      ALLOWED_METHODS: "GET HEAD POST OPTIONS PUT PATCH DELETE"
      MODSEC_RULE_ENGINE: ${WAF_MODE:-On}
      MODSEC_AUDIT_LOG_FORMAT: JSON
      MODSEC_AUDIT_LOG: /dev/stdout
      # Sans la partie B (en-têtes de requête) : elle recopiait « Authorization: Bearer <JWT> » des requêtes journalisées
      # jusque dans Loki. Méthode, URI, client_ip, code de réponse et règles restent (A, F, H) : c'est tout ce que lisent
      # la règle SOC WafAttackBlocked, le détecteur d'anomalies, le moteur et Grafana (revue de durcissement du 20/10).
      MODSEC_AUDIT_LOG_PARTS: AFHZ
      PROXY_TIMEOUT: 20s
      # Le WAF n'est derrière aucun proxy : $remote_addr est l'IP réelle (PC attaquant compris).
      SET_REAL_IP_FROM: 127.0.0.1
    # Blocage d'IP par le moteur de remédiation (services/remediation-engine/docs/waf-blocking.md) : liste lue en
    # lecture seule dans le volume waf-blocklist (écrit par le moteur, uid 10001), appliquée par SIGHUP (rechargement
    # à chaud de nginx). 403 avant ModSecurity, journal JSON event_type=waf_remediation_block ; port interne 8081
    # (non publié) pour que le moteur vérifie la configuration chargée.
    volumes:
      - ./infra/waf/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:/etc/modsecurity.d/owasp-crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:ro
      - ./infra/waf/00-remediation-blocklist.conf.template:/etc/nginx/templates/conf.d/00-remediation-blocklist.conf.template:ro
      - ./infra/waf/location_common.conf.template:/etc/nginx/templates/includes/location_common.conf.template:ro
      - ./infra/waf/99-remediation-blocklist-guard.sh:/docker-entrypoint.d/99-remediation-blocklist-guard.sh:ro
      - waf-blocklist:/waf-blocklist:ro
    networks: [edge, dmz]

  # ─────────────────────────── Observabilité (pilier INFRA) ──────────────────────────
  prometheus:
    <<: *hardening
    image: prom/prometheus:v3.15.0
    mem_limit: 1g
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-7d}
      # Authentification basique sur toute l'API (et /metrics) : interface web, Grafana et futurs composants
      - --web.config.file=/run/secrets/prometheus_web.yml
    read_only: true
    secrets: [prometheus_web.yml, prometheus_password, alertmanager_password]
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "${MGMT_BIND:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    networks: [app, obs, mgmt]

  blackbox:
    <<: *hardening
    image: prom/blackbox-exporter:v0.29.0
    mem_limit: 256m
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    # L'image tourne en root pour les sondes ICMP ; seules des sondes HTTP sont configurées : utilisateur nobody
    user: "65534:65534"
    read_only: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9115/-/healthy"]
      interval: 15s
      timeout: 3s
      retries: 3
    volumes:
      - ./infra/blackbox:/etc/blackbox:ro
    networks: [dmz, obs]

  alertmanager:
    <<: *hardening
    image: prom/alertmanager:v0.34.1
    mem_limit: 256m
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      # Sans identifiant, n'importe quel processus local pourrait poser un silence et masquer une alerte
      - --web.config.file=/run/secrets/alertmanager_web.yml
    read_only: true
    # remediation_webhook_token : jeton porteur des appels au webhook du moteur de remédiation
    secrets: [alertmanager_web.yml, remediation_webhook_token]
    volumes:
      - ./infra/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    ports:
      - "${MGMT_BIND:-127.0.0.1}:${ALERTMANAGER_PORT:-9093}:9093"
    networks: [obs, mgmt]

  # Loki n'a pas d'authentification native : il n'est joignable que sur le réseau interne "obs" (Alloy, Grafana,
  # Prometheus), le port de gestion publié passe par loki-proxy.
  loki:
    <<: *hardening
    image: grafana/loki:3.7.8
    mem_limit: 1g
    command: ["-config.file=/etc/loki/loki.yml"]
    read_only: true
    tmpfs: ["/tmp"]
    secrets: [alertmanager_basic_auth]
    volumes:
      - ./infra/loki/loki.yml:/etc/loki/loki.yml:ro
      - ./infra/loki/rules:/etc/loki/rules:ro
      - loki-data:/loki
    networks: [obs]

  # Seul accès à Loki depuis le PC Hôte : authentification basique (admin / secrets/loki_password) puis relais.
  loki-proxy:
    <<: *hardening
    # Branche stable 1.30 (même code que la 1.29.8, puis correctifs seuls) : le tag 1.29-alpine n'est plus reconstruit
    image: nginxinc/nginx-unprivileged:1.30-alpine
    mem_limit: 128m
    read_only: true
    tmpfs: ["/tmp"]
    secrets: [loki_htpasswd]
    volumes:
      - ./infra/loki-proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
    # /healthz : seule location sans identifiant, ne relaie rien vers Loki
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
    ports:
      - "${MGMT_BIND:-127.0.0.1}:${LOKI_PORT:-3100}:8080"
    depends_on: [loki]
    networks: [obs, mgmt]

  # Collecteur de journaux : lit en lecture seule les fichiers json-file des conteneurs (aucun accès au socket Docker).
  alloy:
    <<: *hardening
    image: grafana/alloy:v1.20.1
    mem_limit: 1g
    # L'image tourne en root (les journaux Docker sont en 0640 root) mais sans aucune capability :
    # l'état d'Alloy est donc rangé dans un volume neuf (/alloy-data) qui lui appartient.
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/alloy-data
      - --disable-reporting
      - /etc/alloy/config.alloy
    read_only: true
    tmpfs: ["/tmp"]
    environment:
      COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-resilience-alpha}
    volumes:
      - ./infra/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - alloy-data:/alloy-data
    depends_on: [loki]
    networks: [obs]

  # Métriques du PC Hôte (CPU, mémoire, disques) et des sauvegardes PostgreSQL (fichiers .prom écrits par
  # resilience-pg-backup / resilience-pg-restore). Aucun accès au socket Docker : l'hôte est lu en lecture seule.
  node-exporter:
    <<: *hardening
    image: prom/node-exporter:v1.12.1
    mem_limit: 128m
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/textfile
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|run|sys|var/lib/docker/.+)($$|/)
    read_only: true
    volumes:
      - /:/host:ro,rslave
      - ${NODE_TEXTFILE_DIR:-/var/lib/node-exporter/textfile}:/textfile:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9100/"]
      interval: 15s
      timeout: 3s
      retries: 3
    networks: [obs]

  grafana:
    <<: *hardening
    image: grafana/grafana:13.2.4
    # 1,2 Gio mesurés (tableaux Santé du service et SOC ouverts)
    mem_limit: 2g
    read_only: true
    tmpfs: ["/tmp"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/service-health.json
      # Durcissement (docs/securite/revue-durcissement.md) : CSP de Grafana (modèle par défaut, avec nonce), cookie de
      # session SameSite=Strict, aucun appel sortant (Gravatar, instantanés publiés sur raintank.io, liens de retour),
      # ni tableau public sans identifiant, ni installation de plugin depuis l'interface. Protection contre la force
      # brute à la connexion : active par défaut (non désactivée ici). Cookie Secure et HSTS : sans objet sans HTTPS.
      GF_SECURITY_CONTENT_SECURITY_POLICY: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_PUBLIC_DASHBOARDS_ENABLED: "false"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      GF_ANALYTICS_FEEDBACK_LINKS_ENABLED: "false"
    secrets: [grafana_admin_password, prometheus_password, alertmanager_password]
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${MGMT_BIND:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on: [prometheus, loki]
    networks: [obs, mgmt]

  # ──────────────────────────── IA locale (pilier IA, optionnel) ─────────────────────
  # LLM de l'assistant RAG : ce conteneur (profil `ai` : `docker compose --profile ai up -d` ou COMPOSE_PROFILES=ai),
  # non publié, joint par le réseau ai ; ou le PC de délestage IA via OLLAMA_BASE_URL. Sur la VM PC Hôte, le pare-feu
  # de l'hôte empêche un conteneur de joindre un Ollama installé sur l'hôte lui-même.
  ollama:
    # Version figée (même empreinte que « latest » au 20/10/2026) : un `docker compose pull` sur la VM ne change plus
    # le moteur du LLM la veille de la démonstration
    image: ollama/ollama:0.40.6
    # 2,8 Gio mesurés avec llama3.2:3b + nomic-embed-text chargés
    mem_limit: 6g
    profiles: [ai]
    restart: unless-stopped
    # root dans l'image (modèles dans /root/.ollama, volume à root) mais sans aucune capability : le serveur écoute
    # sur 11434 et n'écrit que dans ses propres fichiers
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      OLLAMA_NUM_PARALLEL: "1"        # un seul contexte réservé (4 par défaut) : ~1,3 Go de RAM gagnés avec un 3B
      OLLAMA_MAX_LOADED_MODELS: "2"   # LLM + modèle d'embeddings
    volumes:
      - ollama-data:/root/.ollama
    networks: [ai]
    logging: *logging

  # Assistant RAG des opérateurs : consulte les procédures et l'architecture, n'exécute aucune action.
  # Ni socket Docker, ni base, ni moteur de remédiation, ni chaîne d'observation : le corpus en lecture seule et
  # Ollama (OLLAMA_BASE_URL), sur le seul réseau ai. Interface et API protégées (admin / secrets/ops_assistant_password),
  # sauf /health, réduit à l'état pour le healthcheck.
  ops-assistant:
    <<: *hardening
    build:
      context: ./services
      dockerfile: ops-assistant/Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-resilience-alpha}/ops-assistant:latest
    mem_limit: 1g
    read_only: true
    tmpfs: ["/tmp"]
    environment:
      SERVICE_NAME: ops-assistant
      # Conteneur ollama du profil ai (défaut), PC de délestage IA (http://<ip>:11434),
      # ou Ollama natif en développement sous Docker Desktop (http://host.docker.internal:11434)
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      LLM_MODEL: ${OPS_ASSISTANT_LLM_MODEL:-llama3.2:3b}
      EMBED_MODEL: ${OPS_ASSISTANT_EMBED_MODEL:-nomic-embed-text}
      # 4 threads sur les 6 vCPU de la VM : la stack garde du CPU pendant une réponse (0 = tous les cœurs)
      LLM_NUM_THREAD: ${OPS_ASSISTANT_LLM_NUM_THREAD:-4}
      # Désactivé par défaut : Alertmanager exige le compte admin, qui permet aussi de poser des silences ;
      # l'assistant n'en reçoit pas. À rebrancher sur une API d'état en lecture seule (remédiation, supervision).
      ALERTMANAGER_URL: ${OPS_ASSISTANT_ALERTMANAGER_URL:-}
      OPS_ASSISTANT_PASSWORD_FILE: /run/secrets/ops_assistant_password
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    secrets: [ops_assistant_password]
    # Corpus : docs/ (runbooks, gouvernance) + README d'architecture et de contrats, montés un par un en lecture seule.
    volumes:
      - ./docs:/corpus/docs:ro
      - ./README.md:/corpus/README.md:ro
      - ./ansible/README.md:/corpus/ansible/README.md:ro
      - ./services/remediation-engine/README.md:/corpus/services/remediation-engine/README.md:ro
      - ./services/anomaly-detector/README.md:/corpus/services/anomaly-detector/README.md:ro
      - ./services/supervision-dashboard/README.md:/corpus/services/supervision-dashboard/README.md:ro
    extra_hosts: ["host.docker.internal:host-gateway"]   # développement sous Linux ; natif sous Docker Desktop
    ports:
      - "${MGMT_BIND:-127.0.0.1}:${OPS_ASSISTANT_PORT:-8090}:8000"
    # Le réseau ai n'est pas interne : il suffit pour publier le port ; mgmt (Prometheus, Alertmanager…) n'est plus utile.
    networks: [ai]

  # ───────────────────── Détection d'anomalies ML (pilier IA / DATA) ──────────────────
  # Lit Prometheus (et Loki) sur le réseau obs, calcule un score d'anomalie par service et l'expose
  # sur /metrics. Aucun port publié, aucun accès privilégié : même durcissement que les autres services.
  anomaly-detector:
    <<: *hardening
    build:
      context: ./services
      dockerfile: anomaly-detector/Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-resilience-alpha}/anomaly-detector:latest
    mem_limit: 512m
    read_only: true
    tmpfs: ["/tmp"]
    environment:
      SERVICE_NAME: anomaly-detector
      PROMETHEUS_URL: ${ANOMALY_PROMETHEUS_URL:-http://prometheus:9090}
      # Prometheus exige une authentification basique ; Loki interne (réseau obs) n'en a pas.
      PROMETHEUS_USER: admin
      PROMETHEUS_PASSWORD_FILE: /run/secrets/prometheus_password
      LOKI_URL: ${ANOMALY_LOKI_URL:-http://loki:3100}
      SCRAPE_INTERVAL: ${ANOMALY_SCRAPE_INTERVAL:-10}
      # Score périmé (source injoignable) conservé au plus N cycles, puis NaN (« pas de donnée »).
      # Le seuil d'alerte n'est pas réglable ici : il vient du modèle (gauge anomaly_threshold, lue par la règle).
      STALE_AFTER_CYCLES: ${ANOMALY_STALE_AFTER_CYCLES:-3}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    secrets: [prometheus_password]
    depends_on: [prometheus, loki]
    networks: [obs]

  # ───────────────────── Remédiation automatique (pilier DEV / SÉCURITÉ) ─────────────────────
  # Reçoit les alertes d'Alertmanager (POST /alerts, jeton porteur), décide (table de décision), agit, puis vérifie
  # (santé des conteneurs, sondes, transaction témoin à travers le WAF). Aucun port publié, API d'état en lecture seule.
  # Disponibilité → redémarrage via docker-socket-proxy ; compromission → blocage d'IP au WAF (volume waf-blocklist)
  # ou restauration de la base demandée au pont hôte (/bridge, jamais exécutée par le moteur). Détail :
  # services/remediation-engine/README.md.
  remediation-engine:
    <<: *hardening
    build:
      context: ./services
      dockerfile: remediation-engine/Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-resilience-alpha}/remediation-engine:latest
    mem_limit: 512m
    read_only: true
    tmpfs: ["/tmp"]
    environment:
      SERVICE_NAME: remediation-engine
      # Les conteneurs sont retrouvés par leurs labels Compose (projet + service), jamais par un nom reçu dans une alerte
      COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-resilience-alpha}
      DOCKER_PROXY_URL: http://docker-socket-proxy:2375
      PROMETHEUS_URL: http://prometheus:9090
      PROMETHEUS_USER: admin
      PROMETHEUS_PASSWORD_FILE: /run/secrets/prometheus_password
      LOKI_URL: http://loki:3100
      PAYMENT_API_URL: http://payment-api:8000
      WITNESS_BASE_URL: http://waf:8080
      WEBHOOK_TOKEN_FILE: /run/secrets/remediation_webhook_token
      STATE_FILE: /state/remediation-state.json
      WAF_BLOCKLIST_PATH: /waf-blocklist/blocked-ips.conf
      WAF_BLOCK_TTL_SECONDS: ${WAF_BLOCK_TTL_SECONDS:-300}
      WAF_BLOCK_ALLOWLIST: ${WAF_BLOCK_ALLOWLIST:-}
      REMEDIATION_BRIDGE_PATH: /bridge
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    secrets: [prometheus_password, remediation_webhook_token]
    volumes:
      - remediation-state:/state
      - waf-blocklist:/waf-blocklist
      - ${REMEDIATION_BRIDGE_DIR:-./.remediation-bridge}:/bridge
    depends_on: [docker-socket-proxy]
    # obs : Alertmanager, Prometheus, Loki ; app : /internal/integrity de payment-api ; dmz : transaction témoin via
    # waf:8080 ; docker-api : le proxy Docker, et rien d'autre
    networks: [obs, app, dmz, docker-api]

  # Seule porte vers le démon Docker : lecture de l'état des conteneurs, restart / start / kill. Le modèle haproxy
  # durci (services/remediation-engine/proxy/) refuse tout le reste même avec CONTAINERS=1 et POST=1 (création de
  # conteneur, exec, suppression…). Socket en lecture seule, réseau docker-api interne partagé avec le seul moteur.
  docker-socket-proxy:
    <<: *hardening
    image: tecnativa/docker-socket-proxy:v0.5.0
    mem_limit: 256m
    read_only: true
    tmpfs: ["/tmp", "/run", "/var/lib/haproxy"]
    environment:
      CONTAINERS: 1
      POST: 1
      ALLOW_RESTARTS: 1
      ALLOW_START: 1
      ALLOW_STOP: 0
      ALLOW_PAUSE: 0
      ALLOW_UNPAUSE: 0
      AUTH: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      EVENTS: 0
      EXEC: 0
      GRPC: 0
      IMAGES: 0
      INFO: 0
      NETWORKS: 0
      NODES: 0
      PING: 0
      PLUGINS: 0
      SECRETS: 0
      SERVICES: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
      VERSION: 0
      VOLUMES: 0
      DISABLE_IPV6: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./services/remediation-engine/proxy/haproxy.cfg.template:/usr/local/etc/haproxy/haproxy.cfg.template:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2375/containers/json?limit=1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks: [docker-api]

  # ───────────────────── Dashboard de supervision (pilier DEV, écran du Clip Chrono) ─────────────────────
  # Interface React + Tailwind servie par un back-for-front FastAPI (une seule image : node construit, python sert).
  # Le navigateur ne joint que ce service (admin / secrets/supervision_password) ; le back-for-front lit Prometheus et
  # Alertmanager (identifiants en secrets, jamais transmis au navigateur), Loki et l'API d'état du moteur sur obs,
  # par des requêtes prédéfinies et en GET uniquement (ni requête libre, ni POST /alerts, ni silence). Healthy même
  # quand ces sources sont arrêtées (l'interface affiche « source indisponible »). obs est interne : mgmt (non
  # interne, comme Grafana et Prometheus) sert à publier le port sur MGMT_BIND. Détail : services/supervision-dashboard/README.md.
  supervision-dashboard:
    <<: *hardening
    build:
      context: ./services
      dockerfile: supervision-dashboard/Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-resilience-alpha}/supervision-dashboard:latest
    mem_limit: 512m
    read_only: true
    tmpfs: ["/tmp"]
    environment:
      SERVICE_NAME: supervision-dashboard
      ENGINE_URL: http://remediation-engine:8000
      PROMETHEUS_URL: http://prometheus:9090
      PROMETHEUS_USER: admin
      PROMETHEUS_PASSWORD_FILE: /run/secrets/prometheus_password
      ALERTMANAGER_URL: http://alertmanager:9093
      ALERTMANAGER_USER: admin
      ALERTMANAGER_PASSWORD_FILE: /run/secrets/alertmanager_password
      LOKI_URL: http://loki:3100
      SUPERVISION_PASSWORD_FILE: /run/secrets/supervision_password
      # Durée d'affichage de « Service rétabli » après la clôture d'un incident
      RESTORED_WINDOW_SECONDS: ${SUPERVISION_RESTORED_WINDOW_SECONDS:-180}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    secrets: [supervision_password, prometheus_password, alertmanager_password]
    ports:
      - "${MGMT_BIND:-127.0.0.1}:${SUPERVISION_PORT:-8091}:8000"
    networks: [obs, mgmt]

networks:
  edge: {}              # seul réseau joignable depuis le PA du groupe (port publié du WAF)
  dmz:
    internal: true      # WAF <-> frontal nginx ; sous-réseau fixe pour que nginx fasse confiance au WAF (X-Real-IP)
    ipam:
      config: [{ subnet: "172.31.${DMZ_OCTET:-250}.0/24" }]   # DMZ_OCTET entre 248 et 255 : doit rester dans set_real_ip_from (services/frontend/nginx.conf)
  app:
    internal: true      # nginx <-> microservices <-> Prometheus
  data:
    internal: true      # microservices <-> PostgreSQL
  obs:
    internal: true      # chaîne d'observation et de remédiation
  mgmt: {}              # ports de gestion publiés sur 127.0.0.1 uniquement
  ai: {}                # assistant RAG <-> Ollama conteneurisé (sortie Internet pour `ollama pull`)
  docker-api:
    internal: true      # moteur de remédiation <-> docker-socket-proxy, et personne d'autre

volumes:
  pgdata: {}
  prometheus-data: {}
  alertmanager-data: {}
  loki-data: {}
  alloy-data: {}
  grafana-data: {}
  ollama-data: {}
  # Liste des IP bloquées : écrite par remediation-engine (rw, uid 10001), lue par le WAF (ro)
  waf-blocklist: {}
  # Incidents, chronologies et anti-boucle du moteur de remédiation (survivent à son redémarrage)
  remediation-state: {}

# SECRETS_DIR : chemin stable hors des versions sur le PC Hôte (.env écrit par deploy.yml) ; ./secrets en local.
# Compose ne recrée pas un conteneur quand seul le chemin d'un secret change : il ne doit donc pas changer d'une version à l'autre.
secrets:
  postgres_password: { file: "${SECRETS_DIR:-./secrets}/postgres_password" }
  auth_db_password: { file: "${SECRETS_DIR:-./secrets}/auth_db_password" }
  pay_db_password: { file: "${SECRETS_DIR:-./secrets}/pay_db_password" }
  admin_password: { file: "${SECRETS_DIR:-./secrets}/admin_password" }
  admin_totp_secret: { file: "${SECRETS_DIR:-./secrets}/admin_totp_secret" }
  grafana_admin_password: { file: "${SECRETS_DIR:-./secrets}/grafana_admin_password" }
  jwt_private.pem: { file: "${SECRETS_DIR:-./secrets}/jwt_private.pem" }
  jwt_public.pem: { file: "${SECRETS_DIR:-./secrets}/jwt_public.pem" }
  # Comptes des interfaces de gestion : mot de passe en clair pour les clients, hash bcrypt pour les serveurs
  prometheus_password: { file: "${SECRETS_DIR:-./secrets}/prometheus_password" }
  prometheus_web.yml: { file: "${SECRETS_DIR:-./secrets}/prometheus_web.yml" }
  alertmanager_password: { file: "${SECRETS_DIR:-./secrets}/alertmanager_password" }
  alertmanager_web.yml: { file: "${SECRETS_DIR:-./secrets}/alertmanager_web.yml" }
  alertmanager_basic_auth: { file: "${SECRETS_DIR:-./secrets}/alertmanager_basic_auth" }
  loki_htpasswd: { file: "${SECRETS_DIR:-./secrets}/loki_htpasswd" }
  ops_assistant_password: { file: "${SECRETS_DIR:-./secrets}/ops_assistant_password" }
  # Compte admin du dashboard de supervision (vérifié par son back-for-front, sans hash dérivé)
  supervision_password: { file: "${SECRETS_DIR:-./secrets}/supervision_password" }
  # Jeton du webhook Alertmanager → moteur de remédiation (généré par scripts/init_secrets.py)
  remediation_webhook_token: { file: "${SECRETS_DIR:-./secrets}/remediation_webhook_token" }
