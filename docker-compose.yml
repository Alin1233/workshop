# Resilience-Alpha — démonstrateur de cyber-résilience (SI de paiement fictif + chaîne d'observation et de reprise)
# Seul le WAF est publié sur le réseau du groupe. Les interfaces de gestion (Grafana, Prometheus, Loki, Alertmanager)
# ne sont publiées que sur 127.0.0.1 (MGMT_BIND) : base, API, secrets et outils internes ne sont jamais exposés.
name: resilience-alpha

# Le pilote json-file recopie les labels Compose dans chaque ligne de journal :
# Alloy identifie ainsi le service émetteur en lisant les fichiers, sans accès au socket Docker.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    labels: "com.docker.compose.project,com.docker.compose.service"

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  logging: *logging

x-python-service: &python-service
  <<: *hardening
  read_only: true
  tmpfs: ["/tmp"]
  depends_on:
    postgres:
      condition: service_healthy
  networks: [app, data]

services:
  # ───────────────────────────── SI métier (pilier DEV) ─────────────────────────────
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password, auth_db_password, pay_db_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [data]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  auth-service:
    <<: *python-service
    build:
      context: ./services
      dockerfile: auth-service/Dockerfile
    image: resilience-alpha/auth-service:latest
    environment:
      SERVICE_NAME: auth-service
      ROOT_PATH: /api/auth
      DB_NAME: authdb
      DB_USER: auth_svc
      DB_PASSWORD_FILE: /run/secrets/auth_db_password
      JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private.pem
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-900}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@resilience.local}
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    secrets: [auth_db_password, jwt_private.pem, admin_password]

  payment-api:
    <<: *python-service
    build:
      context: ./services
      dockerfile: payment-api/Dockerfile
    image: resilience-alpha/payment-api:latest
    environment:
      SERVICE_NAME: payment-api
      ROOT_PATH: /api/payments
      DB_NAME: paydb
      DB_USER: pay_svc
      DB_PASSWORD_FILE: /run/secrets/pay_db_password
      JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public.pem
      INTEGRITY_INTERVAL_SECONDS: ${INTEGRITY_INTERVAL_SECONDS:-15}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    secrets: [pay_db_password, jwt_public.pem]

  frontend:
    <<: *hardening
    build: ./services/frontend
    image: resilience-alpha/frontend:latest
    read_only: true
    tmpfs: ["/tmp"]
    networks: [dmz, app]

  # ───────────────────────────── Défense (pilier CYBER) ─────────────────────────────
  # WAF ModSecurity + OWASP CRS : unique point d'entrée publié, relaie vers le frontal nginx.
  waf:
    <<: *hardening
    image: owasp/modsecurity-crs:4.25-nginx-alpine-lts
    depends_on: [frontend]
    ports:
      - "${FRONT_BIND:-0.0.0.0}:${FRONT_PORT:-8080}:8080"
    environment:
      BACKEND: http://frontend:8080
      PORT: "8080"
      SERVER_HEADER: ""
      PARANOIA: ${WAF_PARANOIA:-1}
      BLOCKING_PARANOIA: ${WAF_PARANOIA:-1}
      ANOMALY_INBOUND: ${WAF_ANOMALY_INBOUND:-5}
      ALLOWED_METHODS: "GET HEAD POST OPTIONS PUT PATCH DELETE"
      MODSEC_RULE_ENGINE: ${WAF_MODE:-On}
      MODSEC_AUDIT_LOG_FORMAT: JSON
      MODSEC_AUDIT_LOG: /dev/stdout
      MODSEC_AUDIT_LOG_PARTS: ABFHZ
      PROXY_TIMEOUT: 20s
      # Le WAF n'est derrière aucun proxy : $remote_addr est l'IP réelle (PC attaquant compris).
      SET_REAL_IP_FROM: 127.0.0.1
    volumes:
      - ./infra/waf/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:/etc/modsecurity.d/owasp-crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:ro
    networks: [edge, dmz]

  # ─────────────────────────── Observabilité (pilier INFRA) ──────────────────────────
  prometheus:
    <<: *hardening
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-7d}
    read_only: true
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "${MGMT_BIND:-127.0.0.1}:9090:9090"
    networks: [app, obs, mgmt]

  blackbox:
    <<: *hardening
    image: prom/blackbox-exporter:v0.29.0
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    read_only: true
    volumes:
      - ./infra/blackbox:/etc/blackbox:ro
    networks: [dmz, obs]

  alertmanager:
    <<: *hardening
    image: prom/alertmanager:v0.34.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    read_only: true
    volumes:
      - ./infra/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    ports:
      - "${MGMT_BIND:-127.0.0.1}:9093:9093"
    networks: [obs, mgmt]

  loki:
    <<: *hardening
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/loki.yml"]
    read_only: true
    tmpfs: ["/tmp"]
    volumes:
      - ./infra/loki/loki.yml:/etc/loki/loki.yml:ro
      - ./infra/loki/rules:/etc/loki/rules:ro
      - loki-data:/loki
    ports:
      - "${MGMT_BIND:-127.0.0.1}:3100:3100"
    networks: [obs, mgmt]

  # Collecteur de journaux : lit en lecture seule les fichiers json-file des conteneurs (aucun accès au socket Docker).
  alloy:
    <<: *hardening
    image: grafana/alloy:v1.20.1
    # L'image tourne en root (les journaux Docker sont en 0640 root) mais sans aucune capability :
    # l'état d'Alloy est donc rangé dans un volume neuf (/alloy-data) qui lui appartient.
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/alloy-data
      - --disable-reporting
      - /etc/alloy/config.alloy
    read_only: true
    tmpfs: ["/tmp"]
    environment:
      COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-resilience-alpha}
    volumes:
      - ./infra/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - alloy-data:/alloy-data
    depends_on: [loki]
    networks: [obs]

  grafana:
    <<: *hardening
    image: grafana/grafana:13.2.4
    read_only: true
    tmpfs: ["/tmp"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/service-health.json
    secrets: [grafana_admin_password]
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${MGMT_BIND:-127.0.0.1}:3000:3000"
    depends_on: [prometheus, loki]
    networks: [obs, mgmt]

  # ──────────────────────────── IA locale (pilier IA, optionnel) ─────────────────────
  # Par défaut l'assistant RAG utilise l'Ollama du PC Hôte ou du PC de délestage IA (OLLAMA_BASE_URL).
  # `docker compose --profile ai up -d` démarre à la place un Ollama conteneurisé, non publié.
  ollama:
    image: ollama/ollama:latest
    profiles: [ai]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ollama-data:/root/.ollama
    networks: [ai]
    logging: *logging

  # ─────────────────────── Composants à développer par l'équipe ──────────────────────
  # Contrats d'intégration détaillés dans services/<nom>/README.md. Décommenter une fois le code livré.
  #
  # remediation-engine:      # reçoit les webhooks Alertmanager (POST /alerts), agit via docker-socket-proxy
  #   build: ./services/remediation-engine
  #   networks: [obs, app, docker-api]
  #
  # docker-socket-proxy:     # seule porte vers le démon Docker, limitée aux opérations de reprise
  #   image: tecnativa/docker-socket-proxy:latest
  #   environment: { CONTAINERS: 1, POST: 1, ALLOW_RESTARTS: 1 }
  #   volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]
  #   networks: [docker-api]
  #
  # anomaly-detector:        # lit Prometheus/Loki, expose anomaly_score sur /metrics
  #   build: ./services/anomaly-detector
  #   networks: [obs]
  #
  # ops-assistant:           # RAG Ollama + LangChain sur docs/, sans aucun accès privilégié
  #   build: ./services/ops-assistant
  #   environment: { OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}" }
  #   networks: [ai, mgmt]
  #
  # supervision-dashboard:   # React + Tailwind : composants, événements, alertes, avancement de la reprise
  #   build: ./services/supervision-dashboard
  #   networks: [obs, mgmt]

networks:
  edge: {}              # seul réseau joignable depuis le PA du groupe (port publié du WAF)
  dmz:
    internal: true      # WAF <-> frontal nginx ; sous-réseau fixe pour que nginx fasse confiance au WAF (X-Real-IP)
    ipam:
      config: [{ subnet: 172.31.250.0/24 }]   # doit rester aligné sur set_real_ip_from (services/frontend/nginx.conf)
  app:
    internal: true      # nginx <-> microservices <-> Prometheus
  data:
    internal: true      # microservices <-> PostgreSQL
  obs:
    internal: true      # chaîne d'observation et de remédiation
  mgmt: {}              # ports de gestion publiés sur 127.0.0.1 uniquement
  ai: {}                # assistant RAG <-> Ollama conteneurisé (sortie Internet pour `ollama pull`)

volumes:
  pgdata: {}
  prometheus-data: {}
  alertmanager-data: {}
  loki-data: {}
  alloy-data: {}
  grafana-data: {}
  ollama-data: {}

secrets:
  postgres_password: { file: ./secrets/postgres_password }
  auth_db_password: { file: ./secrets/auth_db_password }
  pay_db_password: { file: ./secrets/pay_db_password }
  admin_password: { file: ./secrets/admin_password }
  grafana_admin_password: { file: ./secrets/grafana_admin_password }
  jwt_private.pem: { file: ./secrets/jwt_private.pem }
  jwt_public.pem: { file: ./secrets/jwt_public.pem }
