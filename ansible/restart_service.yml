# Opération de reprise : recrée un service de la version active puis prouve que le métier fonctionne de nouveau.
# Usage : ansible-playbook -i ansible/inventory.ini ansible/restart_service.yml -e service=payment-api
- name: Redémarrer un service et vérifier la reprise
  hosts: pc_hote
  become: true
  gather_facts: false
  vars:
    allowed_services: [auth-service, payment-api, frontend, waf]
  tasks:
    - name: Refuser tout service hors liste (le playbook ne doit pas devenir une porte d'administration)
      ansible.builtin.assert:
        that: service in allowed_services
        fail_msg: "Service non autorisé : {{ service | default('non fourni') }}"

    - name: Lire la version active
      ansible.builtin.stat:
        path: "{{ pc_hote_app_root }}/current"
      register: current

    - name: Vérifier qu'une version est déployée
      ansible.builtin.assert:
        that: current.stat.islnk | default(false)
        fail_msg: "Aucune version active : lancer d'abord deploy.yml"
        quiet: true

    # Chemin réel de la version, pour que Compose retrouve exactement la configuration des conteneurs en place
    - name: Recréer le conteneur et attendre son healthcheck
      ansible.builtin.command: "docker compose up -d --force-recreate --wait --wait-timeout 90 {{ service }}"
      args:
        chdir: "{{ current.stat.lnk_source }}"
      changed_when: true

    - name: Transaction témoin
      ansible.builtin.command: python3 tests/smoke_test.py
      args:
        chdir: "{{ current.stat.lnk_source }}"
      retries: 5
      delay: 5
      register: smoke
      until: smoke.rc == 0
      changed_when: false
