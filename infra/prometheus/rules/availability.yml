# Alertes de disponibilité et d'intégrité, routées par Alertmanager vers le moteur de remédiation.
# Convention de labels (contrat avec services/remediation-engine) :
#   severity : critical | warning
#   domain   : availability | integrity | security | anomaly
#   service  : service concerné (nom du service Compose)
groups:
  - name: availability
    rules:
      - alert: ServiceDown
        expr: up{job=~"auth-service|payment-api"} == 0
        for: 15s
        labels: { severity: critical, domain: availability }
        annotations:
          summary: "{{ $labels.service }} ne répond plus au scrape Prometheus"

      - alert: EndToEndProbeFailed
        expr: probe_success{job="blackbox-http"} == 0
        for: 15s
        labels: { severity: critical, domain: availability }
        annotations:
          summary: "Le parcours client vers {{ $labels.service }} échoue ({{ $labels.instance }})"

      - alert: HighErrorRate
        expr: |
          sum by (service) (rate(http_requests_total{status=~"5.."}[1m]))
            / sum by (service) (rate(http_requests_total[1m])) > 0.2
        for: 30s
        labels: { severity: warning, domain: availability }
        annotations:
          summary: "{{ $labels.service }} : plus de 20 % de réponses 5xx"

      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95, sum by (service, le) (rate(http_request_duration_seconds_bucket{route!="/health"}[1m]))) > 1
        for: 1m
        labels: { severity: warning, domain: availability }
        annotations:
          summary: "{{ $labels.service }} : latence p95 supérieure à 1 s"

  - name: integrity
    rules:
      - alert: LedgerIntegrityBroken
        expr: payment_ledger_integrity_ok == 0
        for: 0s
        labels: { severity: critical, domain: integrity, service: payment-api }
        annotations:
          summary: "Le registre de paiement est incohérent (voir /internal/integrity)"

      - alert: LedgerIntegrityCheckStale
        expr: time() - payment_ledger_integrity_last_check_timestamp > 60
        for: 30s
        labels: { severity: warning, domain: integrity, service: payment-api }
        annotations:
          summary: "Le contrôle d'intégrité du registre ne s'exécute plus"

  - name: security-metrics
    rules:
      - alert: LoginFailureSpike
        expr: sum(rate(auth_login_attempts_total{result="failure"}[1m])) * 60 > 20
        for: 30s
        labels: { severity: warning, domain: security, service: auth-service }
        annotations:
          summary: "Plus de 20 échecs de connexion par minute (force brute probable)"

  # Le détecteur ML publiera anomaly_score (0..1) : décommenter une fois services/anomaly-detector livré.
