# Alertes de disponibilité et d'intégrité, routées par Alertmanager vers le moteur de remédiation.
# Convention de labels (contrat avec services/remediation-engine) :
#   severity : critical | warning
#   domain   : availability | integrity | security | anomaly
#   service  : service concerné (nom du service Compose)
groups:
  - name: availability
    rules:
      - alert: ServiceDown
        expr: up{job=~"auth-service|payment-api"} == 0
        for: 15s
        labels: { severity: critical, domain: availability }
        annotations:
          summary: "{{ $labels.service }} ne répond plus au scrape Prometheus"

      - alert: EndToEndProbeFailed
        expr: probe_success{job="blackbox-http"} == 0
        for: 15s
        labels: { severity: critical, domain: availability }
        annotations:
          summary: "Le parcours client vers {{ $labels.service }} échoue ({{ $labels.instance }})"

      - alert: HighErrorRate
        expr: |
          sum by (service) (rate(http_requests_total{status=~"5.."}[1m]))
            / sum by (service) (rate(http_requests_total[1m])) > 0.2
        for: 30s
        labels: { severity: warning, domain: availability }
        annotations:
          summary: "{{ $labels.service }} : plus de 20 % de réponses 5xx"

      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95, sum by (service, le) (rate(http_request_duration_seconds_bucket{route!="/health"}[1m]))) > 1
        for: 1m
        labels: { severity: warning, domain: availability }
        annotations:
          summary: "{{ $labels.service }} : latence p95 supérieure à 1 s"

  - name: integrity
    rules:
      - alert: LedgerIntegrityBroken
        expr: payment_ledger_integrity_ok == 0
        for: 0s
        labels: { severity: critical, domain: integrity, service: payment-api }
        annotations:
          summary: "Le registre de paiement est incohérent (voir /internal/integrity)"

      - alert: LedgerIntegrityCheckStale
        expr: time() - payment_ledger_integrity_last_check_timestamp > 60
        for: 30s
        labels: { severity: warning, domain: integrity, service: payment-api }
        annotations:
          summary: "Le contrôle d'intégrité du registre ne s'exécute plus"

  - name: security-metrics
    rules:
      - alert: LoginFailureSpike
        expr: sum(rate(auth_login_attempts_total{result="failure"}[1m])) * 60 > 20
        for: 30s
        labels: { severity: warning, domain: security, service: auth-service }
        annotations:
          summary: "Plus de 20 échecs de connexion par minute (force brute probable)"

  # Détecteur ML (services/anomaly-detector), cf. ml/README.md. Le seuil n'est écrit qu'à un endroit : dans le modèle,
  # exposé par le service en `anomaly_threshold` (0,8) ; la comparaison est « ≥ », comme dans le code. Un score NaN
  # (pas de donnée) ne déclenche rien : ce sont alors AnomalyDetectorBlind / AnomalyDetectorDown qui préviennent
  # que la détection est aveugle — sans jamais viser un service métier.
  - name: anomaly
    rules:
      - alert: AnomalyDetected
        expr: anomaly_score >= on(job, instance) group_left() anomaly_threshold
        for: 20s
        labels: { severity: critical, domain: anomaly }
        annotations:
          summary: 'Comportement anormal détecté par le modèle sur {{ $labels.service }} (score {{ printf "%.2f" $value }})'

      - alert: AnomalyDetectorBlind
        expr: anomaly_detector_source_up == 0
        for: 1m
        labels: { severity: warning, domain: anomaly, service: anomaly-detector }
        annotations:
          summary: "Détection ML partielle : la source {{ $labels.source }} est injoignable depuis 1 min"
          description: >-
            Le détecteur ne reçoit plus les données de {{ $labels.source }} : les services qui en dépendent n'ont plus
            de score (anomaly_score = NaN, anomaly_data_available = 0). Ce n'est ni une panne du SI métier ni une
            attaque. Action attendue : notification et vérification de {{ $labels.source }} (conteneur,
            authentification) ; ne redémarrer, n'isoler ni ne bloquer aucun service métier.

      - alert: AnomalyDetectorDown
        expr: up{job="anomaly-detector"} == 0 or (time() - anomaly_detector_last_run_timestamp > 60)
        for: 1m
        labels: { severity: warning, domain: availability, service: anomaly-detector }
        annotations:
          summary: "Le détecteur d'anomalies ne produit plus de score (arrêté, boucle bloquée, modèle ou secret illisible)"
          description: >-
            Plus aucune détection ML : la cause est donnée par GET /health du détecteur (no_model, model_mismatch,
            auth_secret_unreadable…). Le SI métier n'est pas en cause. Seule reprise sûre : redémarrer
            anomaly-detector (sans état) ; aucune action sur les services métier.

  # Moteur de remédiation (services/remediation-engine). Ces alertes portent service=remediation-engine : le moteur les
  # reçoit et les journalise mais n'agit jamais en réponse (anti-boucle) ; elles s'adressent à l'opérateur. Les séries
  # sont créées à zéro au démarrage du moteur, increase() voit donc le premier échec. Les escalades « par conception »
  # (reason="policy" : hôte, sauvegardes) ne sont pas des échecs de remédiation.
  - name: remediation
    rules:
      - alert: RemediationFailed
        expr: |
          sum(increase(remediation_actions_total{result=~"failure|refused"}[10m])) > 0
            or sum(increase(remediation_escalations_total{reason!="policy"}[10m])) > 0
        for: 0s
        labels: { severity: critical, domain: availability, service: remediation-engine }
        annotations:
          summary: "Remédiation automatique en échec ou incident escaladé : intervention humaine requise"
          description: >-
            Une action du moteur a échoué ou un incident a été escaladé (vérification en échec, anti-boucle, pont de
            restauration absent, IP non attribuable…). Détail : GET /api/state du moteur ou journaux
            event_type=remediation_escalated dans Loki.

      - alert: RemediationEngineDown
        expr: up{job="remediation-engine"} == 0
        for: 30s
        labels: { severity: critical, domain: availability, service: remediation-engine }
        annotations:
          summary: "Le moteur de remédiation ne répond plus : plus aucune reprise automatique"
