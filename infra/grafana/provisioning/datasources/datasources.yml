# Sources de données provisionnées (UID stables, référencés par les tableaux de bord et le futur dashboard React)
# Prometheus et Alertmanager exigent une authentification basique ; Loki est joint directement sur le réseau interne "obs".
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    basicAuth: true
    basicAuthUser: admin
    secureJsonData: { basicAuthPassword: "$__file{/run/secrets/prometheus_password}" }
    jsonData: { timeInterval: 10s }
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData: { maxLines: 1000 }
  - name: Alertmanager
    uid: alertmanager
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    basicAuth: true
    basicAuthUser: admin
    secureJsonData: { basicAuthPassword: "$__file{/run/secrets/alertmanager_password}" }
    jsonData: { implementation: prometheus, handleGrafanaManagedAlerts: false }
