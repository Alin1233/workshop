# Exclusions OWASP CRS propres à Resilience-Alpha (chargées avant les règles CRS).
# Ajouter ici une exclusion ciblée lorsqu'un faux positif bloque un usage légitime, en documentant pourquoi.
# Les identifiants de règles déclenchées se lisent dans les journaux du WAF (Loki : {service="waf"} |= "transaction").
#
# Exemple : ne plus inspecter le champ "password" pour la règle 942100 (détection SQLi libinjection)
# SecRuleUpdateTargetById 942100 "!ARGS:password"

# 920350 « Host header is a numeric IP address » (PL1, WARNING, 3 points) — retirée (revue de durcissement du 20/10,
# docs/securite/revue-durcissement.md). Le PC Hôte n'a pas de nom DNS : le jury, les opérateurs, le PC attaquant et les
# tests l'appellent tous par son IP, donc cette règle se déclenchait sur 100 % du trafic légitime venu du réseau
# (1 363 transactions sur 1 543 en 5 min de trafic normal). Elle consommait 3 des 5 points du seuil de blocage : une
# seule autre règle de niveau NOTICE suffisait à bloquer un client légitime, puis, par WafAttackBlocked, l'IP NAT
# partagée par tout le labo. Elle faisait aussi journaliser chaque requête légitime dans l'audit (et donc dans Loki).
# Mesuré sans elle : 13/13 injections de attack.py et 42/47 charges du jeu élargi toujours bloquées au PL1, comme avant.
# Retrait à l'exécution (ctl), la règle CRS étant chargée après ce fichier.
SecAction "id:1001,phase:1,pass,nolog,t:none,ctl:ruleRemoveById=920350"
