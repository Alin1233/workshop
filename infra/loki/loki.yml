# Loki — centralisation des journaux (mode mono-processus, stockage local). Sert aussi de moteur de règles SOC.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h
  allow_structured_metadata: true
  volume_enabled: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

# Règles d'alerte LogQL (fonction SOC) : infra/loki/rules/fake/*.yml ("fake" = locataire unique sans authentification)
ruler:
  storage:
    type: local
    local:
      directory: /etc/loki/rules
  rule_path: /tmp/loki-rules
  alertmanager_url: http://alertmanager:9093
  # Alertmanager exige une authentification basique : en-tête « Basic <base64(admin:mot de passe)> » dérivé par init_secrets.py
  alertmanager_client:
    type: Basic
    credentials_file: /run/secrets/alertmanager_basic_auth
  evaluation_interval: 15s
  enable_api: true

analytics:
  reporting_enabled: false
