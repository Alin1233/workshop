# Proxy d'authentification de Loki (qui n'en a pas nativement) : seul chemin vers Loki depuis le PC Hôte (127.0.0.1:3100).
# Alloy, Grafana, Prometheus et le ruler continuent de joindre loki:3100 directement sur le réseau interne "obs".
log_format json_access escape=json
  '{"ts":"$time_iso8601","service":"loki-proxy","msg":"http_request","request_id":"$request_id",'
  '"client_ip":"$remote_addr","user":"$remote_user","method":"$request_method","path":"$uri","status":$status,'
  '"bytes":$body_bytes_sent,"duration_ms":$request_time,"upstream_status":"$upstream_status"}';

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

server {
    listen 8080;
    server_tokens off;
    access_log /dev/stdout json_access;
    client_max_body_size 10m;

    # Résolution DNS Docker dynamique : Loki est retrouvé après un redémarrage ou une recréation (nouvelle IP).
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $loki http://loki:3100;

    auth_basic "Loki";
    auth_basic_user_file /run/secrets/loki_htpasswd;

    # Healthcheck Docker du proxy lui-même : seule location sans identifiant, ne joint pas Loki et ne renvoie rien d'autre
    location = /healthz {
        auth_basic off;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass $loki;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # L'identifiant s'arrête au proxy : Loki ne reçoit pas le mot de passe
        proxy_set_header Authorization "";
        # /loki/api/v1/tail est un WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }
}
