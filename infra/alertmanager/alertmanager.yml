# Alertmanager — regroupe les alertes Prometheus/Loki et les transmet au moteur de remédiation.
# Le webhook est authentifié par un jeton porteur (secret remediation_webhook_token, relu à chaque envoi) : sans lui,
# le moteur refuse la notification (401). Si le moteur est arrêté, les envois échouent (journaux d'Alertmanager) mais
# les alertes restent consultables dans Grafana et sur http://127.0.0.1:9093 (RemediationEngineDown se déclenche).
route:
  receiver: remediation-engine
  group_by: [alertname, service]
  group_wait: 5s          # démonstration : réaction en quelques secondes
  group_interval: 30s
  repeat_interval: 5m

receivers:
  - name: remediation-engine
    webhook_configs:
      - url: http://remediation-engine:8000/alerts
        send_resolved: true
        max_alerts: 20
        http_config:
          authorization:
            type: Bearer
            credentials_file: /run/secrets/remediation_webhook_token
