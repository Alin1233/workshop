# Reverse proxy unique exposé au réseau : sert le front React et relaie /api vers les microservices.
log_format json_access escape=json
  '{"ts":"$time_iso8601","service":"frontend","msg":"http_request","request_id":"$request_id",'
  '"client_ip":"$remote_addr","method":"$request_method","path":"$uri","status":$status,'
  '"bytes":$body_bytes_sent,"duration_ms":$request_time,"upstream":"$upstream_addr",'
  '"upstream_status":"$upstream_status","user_agent":"$http_user_agent"}';

server {
    listen 8080;
    server_tokens off;
    access_log /dev/stdout json_access;
    client_max_body_size 64k;

    # Résolution DNS Docker dynamique : après le redémarrage ou la recréation d'un service (nouvelle IP),
    # nginx le retrouve sans avoir à être relancé lui-même.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Le frontal n'est joignable que par le WAF (réseau dmz) : l'IP du client est reprise de l'en-tête X-Real-IP
    # posé par le WAF, et uniquement lorsqu'elle provient du réseau dmz de docker-compose.yml (172.31.<DMZ_OCTET>.0/24,
    # octet 250 par défaut, 248 à 255 pour les stacks parallèles des worktrees).
    set_real_ip_from 172.31.248.0/21;
    real_ip_header X-Real-IP;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # On écrase (au lieu de compléter) X-Forwarded-For : l'IP journalisée ne peut pas être falsifiée par le client.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;

    # Endpoints réservés au réseau interne (Prometheus, moteur de remédiation) : jamais publiés.
    location ~ ^/api/[^/]+/(metrics|internal)(/|$) {
        return 404;
    }

    location /api/auth/ {
        set $auth_upstream http://auth-service:8000;
        rewrite ^/api/auth/(.*)$ /$1 break;
        proxy_pass $auth_upstream;
    }

    location /api/payments/ {
        set $payment_upstream http://payment-api:8000;
        rewrite ^/api/payments/(.*)$ /$1 break;
        proxy_pass $payment_upstream;
    }

    # Service indisponible : réponse JSON homogène pour que le front affiche un message clair.
    error_page 502 503 504 = @upstream_down;
    location @upstream_down {
        default_type application/json;
        return 503 '{"code":"service_unavailable","detail":"Service momentanément indisponible. Réessayez dans quelques instants."}';
    }

    location = /healthz {
        default_type application/json;
        return 200 '{"service":"frontend","status":"ok"}';
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
